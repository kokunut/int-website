<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인트 | 인공지능융합대학 학생회</title>
<meta name="description" content="세종대학교 인공지능융합대학 학생회 인트">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* ===================================================================
   색상 미정 → 전부 회색 토큰. 색이 정해지면 :root 값만 교체하면 됨
   =================================================================== */
:root{
  --bg:#ffffff;
  --surface:#f6f6f7;      /* 캘린더 우측 패널, hover 배경 */
  --surface-2:#ececee;    /* 배너·이미지 자리 */
  --line:#e3e3e6;
  --text:#17171a;
  --text-2:#55565c;
  --text-3:#9b9ca2;
  --accent:#17171a;       /* 주요 버튼·선택 날짜·진행바 → 브랜드 컬러 자리 */
  --accent-ink:#ffffff;
  --sun:var(--text);      /* 일요일 (이미지에선 빨강) */
  --sat:var(--text);      /* 토요일 (이미지에선 파랑) */
  --cat-academic:var(--text);   /* 캘린더 카테고리 색 → 지금은 모양으로 구분 */
  --cat-event:var(--text-2);
  --cat-contest:var(--text);
  --radius:14px;
  --container:1200px;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--text);background:var(--bg);line-height:1.55;-webkit-font-smoothing:antialiased;word-break:keep-all}
a{color:inherit;text-decoration:none}
button,select,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
ul,ol{list-style:none}
img{display:block;max-width:100%}
.container{max-width:var(--container);margin:0 auto;padding:0 20px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- 상단 네비게이션 ---------- */
.gnb{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--line)}
.gnb-inner{height:68px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.logo{display:flex;align-items:baseline;gap:10px}
.logo-mark{font-size:30px;font-weight:900;letter-spacing:-.05em;line-height:1}
.logo-sub{font-size:13px;color:var(--text-2)}
.menu{display:flex;gap:2px}
.menu>li{position:relative}
.menu-top{display:block;padding:10px 18px;font-weight:600;border-radius:10px}
.menu-top:hover,.menu>li:focus-within>.menu-top{background:var(--surface)}
.menu-top.active{box-shadow:inset 0 -2px 0 var(--text);border-radius:10px 10px 0 0}
.sub{position:absolute;top:100%;left:50%;transform:translateX(-50%);min-width:180px;padding:8px;background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.08);opacity:0;visibility:hidden;transition:opacity .15s,visibility .15s}
.menu>li:hover .sub,.menu>li:focus-within .sub{opacity:1;visibility:visible}
.sub a{display:flex;justify-content:space-between;gap:12px;padding:9px 12px;border-radius:8px;font-size:15px;color:var(--text-2)}
.sub a:hover{background:var(--surface);color:var(--text)}
.ext::after{content:'↗';font-size:12px;color:var(--text-3)}
.burger{display:none;width:42px;height:42px;align-items:center;justify-content:center;border-radius:10px}
.burger span,.burger span::before,.burger span::after{display:block;width:20px;height:2px;background:var(--text);position:relative;transition:.2s}
.burger span::before,.burger span::after{content:'';position:absolute;left:0}
.burger span::before{top:-6px}.burger span::after{top:6px}
.gnb.open .burger span{background:transparent}
.gnb.open .burger span::before{top:0;transform:rotate(45deg)}
.gnb.open .burger span::after{top:0;transform:rotate(-45deg)}

@media (max-width:860px){
  .burger{display:flex}
  .logo-sub{display:none}
  .gnb nav{position:fixed;inset:68px 0 0 0;background:var(--bg);overflow:auto;padding:8px 20px 48px;display:none}
  .gnb.open nav{display:block}
  .menu{flex-direction:column;gap:0}
  .menu-top{padding:16px 2px 8px;font-size:19px;border-radius:0}
  .menu-top.active{box-shadow:none;text-decoration:underline;text-underline-offset:6px}
  .sub{position:static;transform:none;opacity:1;visibility:visible;box-shadow:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:0 0 12px}
  .sub a{padding:10px 2px}
}

/* ---------- 공통 ---------- */
.section{margin-top:72px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.sec-head h2{font-size:26px;font-weight:800;letter-spacing:-.03em}
.more{font-size:14px;color:var(--text-2);white-space:nowrap}
.more:hover{color:var(--text)}
.card{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:48px;padding:0 22px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;white-space:nowrap}
.btn:hover{opacity:.88}
.btn.ghost{background:var(--bg);color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--surface);opacity:1}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;border:1px solid var(--line);color:var(--text-2);white-space:nowrap}
.badge.solid{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.placeholder{display:grid;place-items:center;background:var(--surface-2);color:var(--text-3);font-size:14px;text-align:center}
.note{font-size:13px;color:var(--text-3)}

/* ---------- 배너 ---------- */
.banner{margin-top:28px;border-radius:18px;overflow:hidden;background:var(--surface-2)}
.banner-track{display:flex;transition:transform .55s ease}
.slide{flex:0 0 100%;display:block;aspect-ratio:4.1/1}
.slide img{width:100%;height:100%;object-fit:cover}
.bn-tpl{height:100%;display:flex;justify-content:space-between;gap:24px;padding:clamp(20px,3vw,40px) clamp(20px,3.2vw,44px)}
.bn-left{flex:1;min-width:0;display:flex;flex-direction:column}
.bn-word{font-family:'Times New Roman',Georgia,serif;font-size:clamp(44px,7.6vw,100px);font-weight:900;line-height:.86;letter-spacing:-.02em}
.bn-word::after{content:'.';}
.bn-slogan{font-size:clamp(16px,2.3vw,30px);font-weight:800;letter-spacing:-.03em;margin-top:clamp(10px,1.4vw,18px)}
.bn-lines{margin-top:auto;display:grid;gap:clamp(8px,1.1vw,14px);padding-top:16px}
.bn-lines i{display:block;height:1px;background:var(--text-3)}
.bn-place{margin-top:clamp(8px,1vw,12px);font-size:clamp(12px,1.15vw,16px)}
.bn-place b,.bn-right>b{display:block;font-weight:800;letter-spacing:.02em}
.bn-right{display:flex;flex-direction:column;justify-content:flex-end;gap:clamp(4px,.7vw,10px);text-align:right;font-size:clamp(11px,1.1vw,15px)}
.bn-right div b{display:block;font-weight:700}
.bn-right div span{color:var(--text-2)}
.banner-ctrl{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.dots-row{display:flex;gap:6px}
.dots-row button{width:8px;height:8px;border-radius:999px;background:var(--line);transition:width .2s}
.dots-row button.on{width:24px;background:var(--text)}
.arrows{display:flex;align-items:center;gap:4px;font-size:14px;color:var(--text-2)}
.arrows button{width:34px;height:34px;border-radius:999px;border:1px solid var(--line);font-size:16px}
.arrows button:hover{background:var(--surface)}
.arrows .count{min-width:44px;text-align:center;font-variant-numeric:tabular-nums}

@media (max-width:720px){
  .slide{aspect-ratio:auto}
  .slide.is-img{aspect-ratio:16/9}
  .bn-tpl{flex-direction:column;min-height:300px}
  .bn-right{text-align:left;flex-direction:row;flex-wrap:wrap;gap:8px 18px}
  .bn-right>b{width:100%}
}

/* ---------- 캘린더 (학사일정 이미지 레이아웃) ---------- */
.cal-tools{display:flex;align-items:center;gap:14px}
.select{position:relative}
.select select{appearance:none;-webkit-appearance:none;height:46px;min-width:170px;padding:0 44px 0 18px;border:1px solid var(--line);border-radius:4px;background:var(--bg);font-size:16px;cursor:pointer}
.select::after{content:'';position:absolute;right:18px;top:50%;width:8px;height:8px;border-right:2px solid var(--text-3);border-bottom:2px solid var(--text-3);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.plus{width:40px;height:40px;display:grid;place-items:center;font-size:32px;font-weight:200;line-height:1;border-radius:8px}
.plus:hover{background:var(--surface)}
.cal{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:28px}
.cal-grid-wrap{border:1px solid var(--line);border-radius:12px;padding:18px 0 10px}
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:0 24px 14px;border-bottom:1px solid var(--line)}
.cal-title{font-size:24px;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.cal-nav{display:flex;gap:2px}
.cal-nav button{width:34px;height:34px;border-radius:8px;font-size:24px;line-height:1;color:var(--text-2)}
.cal-nav button:hover{background:var(--surface)}
.cal-week,.cal-days{display:grid;grid-template-columns:repeat(7,1fr);padding:0 8px}
.cal-week span{text-align:center;font-weight:600;padding:14px 0 6px}
.cal-week .sun,.day.sun:not(.out){color:var(--sun)}
.cal-week .sat,.day.sat:not(.out){color:var(--sat)}
.day{position:relative;height:50px;display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--text-2);font-variant-numeric:tabular-nums}
.day .num{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;transition:background .12s}
.day:hover .num{background:var(--surface)}
.day.out{color:var(--text-3);opacity:.45}
.day.today .num{box-shadow:inset 0 0 0 1.5px var(--text)}
.day.sel .num,.day.sel:hover .num{background:var(--accent);color:var(--accent-ink)}
.day .dots{position:absolute;bottom:1px;left:50%;transform:translateX(-50%);display:flex;gap:4px}
.mk{display:inline-block;width:6px;height:6px;flex:none}
.mk-academic{border-radius:50%;background:var(--cat-academic)}
.mk-event{border-radius:1px;background:var(--cat-event)}
.mk-contest{transform:rotate(45deg) scale(.9);box-shadow:inset 0 0 0 1.5px var(--cat-contest)}
.cal-legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:12px 24px 4px;font-size:13px;color:var(--text-2)}
.cal-legend span{display:flex;align-items:center;gap:6px}
.cal-panel{background:var(--surface);border-radius:12px;padding:28px 34px}
.cal-panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px}
.cal-panel-title{font-size:15px;font-weight:700;color:var(--text-2)}
.link-btn{font-size:13px;color:var(--text-2);text-decoration:underline;text-underline-offset:3px}
.ev{display:flex;gap:16px;padding:16px 0}
.ev .mk{margin-top:10px}
.ev strong{display:block;font-size:19px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ev p{font-size:16px;color:var(--text-2);margin-top:4px}
.ev small{display:inline-block;margin-top:6px;font-size:12px;color:var(--text-3)}
a.ev:hover p{color:var(--text);text-decoration:underline;text-underline-offset:3px}
.cal-empty{padding:40px 0;color:var(--text-3);text-align:center}
@media (max-width:860px){
  .cal{grid-template-columns:1fr;gap:16px}
  .cal-panel{padding:22px 22px}
  .select select{min-width:140px;height:42px}
}
@media (max-width:400px){
  .day{height:46px;font-size:15px}
  .day .num{width:36px;height:36px}
}

/* ---------- 홈 상단: 캘린더 + 페이백 ---------- */
.home-top{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:stretch}
.home-top #home-cal{display:flex;flex-direction:column}
.home-top .cal{flex:1}
.home-top .sec-head{min-height:42px}
.home-pb{display:flex;flex-direction:column;align-self:stretch}

/* 컴팩트 캘린더 (홈) */
.cal-compact .select select{height:40px;min-width:130px;font-size:15px;padding:0 40px 0 14px}
.cal-compact .select::after{right:15px}
.cal-compact .plus{width:36px;height:36px;font-size:28px}
.cal-compact .cal{grid-template-columns:minmax(0,1fr) minmax(0,.9fr);gap:16px}
.cal-compact .cal-grid-wrap{padding:14px 0 6px}
.cal-compact .cal-head{padding:0 16px 10px}
.cal-compact .cal-title{font-size:19px}
.cal-compact .cal-nav button{width:30px;height:30px;font-size:20px}
.cal-compact .cal-week,.cal-compact .cal-days{padding:0 6px}
.cal-compact .cal-week span{padding:10px 0 4px;font-size:13px}
.cal-compact .day{height:40px;font-size:14px}
.cal-compact .day .num{width:32px;height:32px}
.cal-compact .day .dots{gap:3px}
.cal-compact .mk{width:5px;height:5px}
.cal-compact .cal-legend{padding:8px 16px 4px;font-size:12px;gap:4px 12px}
.cal-compact .cal-panel{padding:18px 20px;display:flex;flex-direction:column;min-height:0}
.cal-compact .cal-list{flex:1;overflow:auto;margin-right:-8px;padding-right:8px}
@media (min-width:561px){.cal-compact .cal-list{max-height:330px}}
.cal-compact .ev{gap:12px;padding:11px 0}
.cal-compact .ev .mk{margin-top:8px}
.cal-compact .ev strong{font-size:16px}
.cal-compact .ev p{font-size:14px;margin-top:2px}
.cal-compact .ev small{display:none}

/* 세로형 페이백 카드 (홈, 넓은 화면) */
@media (min-width:1081px){
  .home-pb .pb{flex:1;grid-template-columns:minmax(0,1fr);align-content:space-between;gap:18px;padding:22px 24px}
  .home-pb .pb-num{font-size:46px}
  .home-pb .bar{margin-top:12px}
  .home-pb .pb-stats{gap:12px 16px}
  .home-pb .pb-stats dd{font-size:14px;white-space:nowrap}
  .home-pb .pb-cta{align-items:stretch}
  .home-pb .pb-cta .note{text-align:center}
}
@media (max-width:1080px){
  .home-top{grid-template-columns:minmax(0,1fr);gap:72px}
}
@media (max-width:560px){
  .cal-compact .cal{grid-template-columns:minmax(0,1fr)}
}

/* ---------- 검정비 페이백 ---------- */
.pb{display:grid;grid-template-columns:1.25fr 1fr auto;gap:36px;align-items:center;padding:32px 36px}
.pb-label{font-size:15px;font-weight:700;color:var(--text-2)}
.pb-rate{display:flex;align-items:baseline;gap:4px;margin-top:2px}
.pb-num{font-size:60px;font-weight:900;letter-spacing:-.05em;line-height:1.05;font-variant-numeric:tabular-nums}
.pb-unit{font-size:26px;font-weight:800}
.bar{height:14px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-top:16px}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:inherit;transition:width 1.1s cubic-bezier(.2,.7,.2,1)}
.pb-scale{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;color:var(--text-3)}
.pb-stats{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px 24px}
.pb-stats dt{font-size:13px;color:var(--text-3)}
.pb-stats dd{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.pb-stats dd.pb-sub{font-size:13px;font-weight:400;color:var(--text-2)}
.pb-cta{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
@media (max-width:960px){
  .pb{grid-template-columns:minmax(0,1fr);gap:28px;padding:26px 22px}
  .pb-cta{align-items:stretch}
  .pb-cta .note{text-align:center}
}

/* ---------- 목록 ---------- */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px}
.list{border-top:2px solid var(--text)}
.list li a{display:flex;align-items:center;gap:12px;padding:17px 4px;border-bottom:1px solid var(--line)}
.list li a:hover .t{text-decoration:underline;text-underline-offset:3px}
.list .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.list .d{font-size:14px;color:var(--text-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.cal-chip{display:inline-flex;flex:none;align-items:center;gap:6px;font-size:12px;color:var(--text-2);white-space:nowrap}
.empty{padding:40px 0;text-align:center;color:var(--text-3)}

/* ---------- 바로가기 ---------- */
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.qk{display:flex;flex-direction:column;justify-content:space-between;gap:24px;min-height:150px;padding:24px 26px;border:1px solid var(--line);border-radius:var(--radius);transition:background .15s}
.qk:hover{background:var(--surface)}
.qk small{font-size:13px;color:var(--text-3)}
.qk strong{display:block;font-size:21px;font-weight:800;letter-spacing:-.03em;margin-top:4px}
.qk .arr{align-self:flex-end;font-size:22px}
@media (max-width:480px){.list .cal-chip{display:none}}
@media (max-width:860px){
  .two{grid-template-columns:minmax(0,1fr);gap:56px}
  .quick{grid-template-columns:1fr}
  .qk{min-height:0}
}

/* ---------- 하위 페이지 ---------- */
.page{padding-top:48px}
.crumb{font-size:14px;color:var(--text-3)}
.page-head h1{font-size:36px;font-weight:800;letter-spacing:-.04em;margin-top:4px}
.page-desc{margin-top:8px;color:var(--text-2)}
.page-head{margin-bottom:36px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.tabs a,.tabs button{height:40px;padding:0 16px;display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;font-size:15px;color:var(--text-2)}
.tabs .on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:16px}
.toolbar .tabs{margin:0}
.search{height:42px;width:min(280px,100%);padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.box{padding:26px 28px}
.box h3{font-size:20px;font-weight:800;letter-spacing:-.03em}
.box p{color:var(--text-2);margin-top:6px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tags span{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--surface);color:var(--text-2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin-top:16px;font-size:14px}
.kv dt{color:var(--text-3)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;counter-reset:s}
.steps li{padding:20px 22px;border:1px solid var(--line);border-radius:12px;counter-increment:s}
.steps li::before{content:'0' counter(s);display:block;font-size:13px;font-weight:800;color:var(--text-3);margin-bottom:6px}
.steps b{display:block}
.steps span{font-size:14px;color:var(--text-2)}
.bullets{display:grid;gap:8px;color:var(--text-2)}
.bullets li{padding-left:14px;position:relative}
.bullets li::before{content:'';position:absolute;left:0;top:.7em;width:4px;height:4px;border-radius:50%;background:var(--text-3)}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{display:flex;gap:14px;align-items:center;padding:20px 4px;cursor:pointer;font-weight:600;list-style:none}
.faq summary::-webkit-details-marker{display:none}
.faq summary::before{content:'Q';font-weight:900;color:var(--text-3)}
.faq summary::after{content:'+';margin-left:auto;font-size:22px;font-weight:300;color:var(--text-3)}
.faq details[open] summary::after{content:'−'}
.faq .a{padding:0 4px 22px 30px;color:var(--text-2)}
.doc-row{display:flex;align-items:center;gap:12px;padding:16px 4px;border-bottom:1px solid var(--line)}
.doc-row .t{flex:1;min-width:0;font-weight:500}
.doc-row .btn{height:36px;padding:0 14px;font-size:14px;border-radius:8px}
.article{max-width:760px}
.article h1{font-size:30px;font-weight:800;letter-spacing:-.04em;margin-top:10px}
.article .meta{color:var(--text-3);font-size:14px;margin-top:8px}
.article .body{margin-top:28px;padding-top:28px;border-top:1px solid var(--line);display:grid;gap:14px}
.callout{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:20px;padding:16px 18px;border-radius:12px;background:var(--surface);font-size:15px}
.org{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.org .box{padding:22px}
.org .box h3{font-size:17px}
.org .box p{font-size:14px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
/* 상세 페이지 공통 */
.back{display:inline-block;margin-bottom:20px}
.detail{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:44px;align-items:start}
.detail-aside{position:sticky;top:92px;display:flex;flex-direction:column;gap:10px}
.detail-aside .kv{margin:4px 0 10px}
.detail-aside .kv dd{font-weight:600}
.d-media{border-radius:var(--radius);max-height:440px;width:100%}
.d-title{font-size:34px;font-weight:800;letter-spacing:-.04em;margin-top:8px;line-height:1.3}
.d-lead{font-size:17px;color:var(--text-2);margin:10px 0 28px}
.d-dday{font-size:40px;font-weight:900;letter-spacing:-.04em;line-height:1.1}
.d-sec{margin-top:48px}
.d-sec h2{font-size:20px;font-weight:800;letter-spacing:-.03em;margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid var(--text)}
.d-body{display:grid;gap:12px;color:var(--text-2)}
.timeline li{display:flex;justify-content:space-between;gap:16px;padding:14px 4px;border-bottom:1px solid var(--line)}
.timeline span{color:var(--text-2);font-variant-numeric:tabular-nums}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{text-align:left;font-size:13px;font-weight:600;color:var(--text-3);padding:0 4px 10px}
.tbl td{padding:14px 4px;border-top:1px solid var(--line)}
.curri{display:grid;gap:14px}
.curri>div{display:grid;grid-template-columns:72px 1fr;align-items:center;gap:12px}
.curri .tags{margin:0}
.pager{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:64px}
.pager a{display:flex;flex-direction:column;gap:4px;padding:18px 20px;border:1px solid var(--line);border-radius:12px;min-width:0}
.pager a:hover{background:var(--surface)}
.pager a.nx{text-align:right}
.pager small{font-size:13px;color:var(--text-3)}
.pager span{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hover-card{transition:background .15s}
.hover-card:hover{background:var(--surface)}
.doc-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.doc-viewer{margin-top:32px;aspect-ratio:1/1.414;max-height:900px;width:100%;border-radius:12px;line-height:1.8}
.doc-row a.t:hover{text-decoration:underline;text-underline-offset:3px}
@media (max-width:960px){
  .detail{grid-template-columns:minmax(0,1fr);gap:32px}
  .detail-aside{position:static}
}
@media (max-width:560px){
  .d-title{font-size:28px}
  .pager{grid-template-columns:minmax(0,1fr)}
  .pager a.nx{text-align:left}
}
.contest-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);overflow:hidden;margin-bottom:16px}
@media (max-width:720px){.split,.contest-hero{grid-template-columns:1fr}.page-head h1{font-size:30px}}

/* ---------- 푸터 ---------- */
.footer{margin-top:120px;border-top:1px solid var(--line);background:var(--surface);padding:44px 0 36px}
.foot-inner{display:flex;flex-wrap:wrap;justify-content:space-between;gap:28px}
.foot-inner p{color:var(--text-2);font-size:14px}
.foot-info{display:grid;gap:6px}
.foot-info b{display:inline-block;min-width:84px;color:var(--text);font-weight:700}
.foot-copy{margin-top:32px;font-size:13px;color:var(--text-3)}

/* ---------- FAB (카카오톡 문의) ---------- */
.fab{position:fixed;right:24px;bottom:24px;z-index:60;display:flex;align-items:center;gap:8px;height:56px;padding:0 22px 0 18px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;box-shadow:0 10px 28px rgba(0,0,0,.18)}
.fab:hover{transform:translateY(-2px)}
.fab svg{width:22px;height:22px}
@media (max-width:600px){.fab{right:16px;bottom:16px;width:56px;padding:0;justify-content:center}.fab span{display:none}}

/* ---------- 공모전 팝업 ---------- */
.modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.45)}
.modal[hidden]{display:none}
.modal-box{width:min(420px,100%);max-height:calc(100vh - 40px);overflow:auto;background:var(--bg);border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.modal-img{aspect-ratio:4/3}
.modal-body{padding:22px 24px 20px}
.modal-body h2{font-size:21px;font-weight:800;letter-spacing:-.03em;margin-top:8px}
.modal-body p{color:var(--text-2);margin-top:6px;font-size:15px}
.modal-body .btn{width:100%;margin-top:18px}
.modal-foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:14px 20px;border-top:1px solid var(--line);background:var(--surface);font-size:14px}
.modal-foot label{display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--text-2)}
.modal-foot input{width:16px;height:16px;accent-color:var(--accent)}
.modal-foot .close{margin-left:auto;font-weight:700}

@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const pad = n => String(n).padStart(2, '0');
const toDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const md = s => { const d = toDate(s); return `${d.getMonth() + 1}.${d.getDate()}`; };
const full = s => s.replaceAll('-', '.');
const range = (a, b) => a === b ? md(a) : `${md(a)} ~ ${md(b)}`;
const won = n => n.toLocaleString('ko-KR') + '원';
const WEEK = ['일', '월', '화', '수', '목', '금', '토'];
const TODAY = (() => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); })();
const TODAY_S = ymd(TODAY);
const dday = s => Math.round((toDate(s) - TODAY) / 864e5);
const contestStatus = c => TODAY < toDate(c.start) ? '예정' : TODAY > toDate(c.end) ? '마감' : '진행중';
const ext = 'target="_blank" rel="noopener"';

const CAT = { academic: '학사일정', event: '학생회 행사', contest: '공모전' };
function buildEvents() {
  const list = [];
  DATA.academic.forEach(e => list.push({ cat: 'academic', title: e.title, start: e.start, end: e.end || e.start }));
  DATA.notices.filter(n => n.event).forEach(n =>
    list.push({ cat: 'event', title: n.title, start: n.event.start, end: n.event.end || n.event.start, link: `#/notice/${n.id}` }));
  DATA.contests.forEach(c => list.push({ cat: 'contest', title: `${c.title} 마감`, start: c.end, end: c.end, link: `#/contest/${c.id}` }));
  return list.sort((a, b) => a.start.localeCompare(b.start) || a.end.localeCompare(b.end));
}
const EVENTS = buildEvents();

function mountBanner(root) {
  const slides = DATA.banners;
  let i = 0, timer = null;
  const slideHtml = b => {
    if (b.image) {
      return `<a class="slide is-img" href="${b.href}"><picture>
        ${b.imageMobile ? `<source media="(max-width:720px)" srcset="${b.imageMobile}">` : ''}
        <img src="${b.image}" alt="${b.slogan}"></picture></a>`;
    }
    return `<a class="slide" href="${b.href}"><div class="bn-tpl">
      <div class="bn-left">
        <div class="bn-word">${b.word}</div>
        <p class="bn-slogan">${b.slogan}</p>
        <div class="bn-lines"><i></i><i></i></div>
        <div class="bn-place"><b>${b.placeLabel}</b><span>${b.place}</span></div>
      </div>
      <div class="bn-right"><b>LINK</b>${b.links.map(([k, v]) => `<div><b>${k}</b><span>${v}</span></div>`).join('')}</div>
    </div></a>`;
  };
  root.innerHTML = `
    <div class="banner" aria-roledescription="carousel" aria-label="배너">
      <div class="banner-track">${slides.map(slideHtml).join('')}</div>
    </div>
    <div class="banner-ctrl">
      <div class="dots-row">${slides.map((_, k) => `<button aria-label="${k + 1}번 배너"></button>`).join('')}</div>
      <div class="arrows">
        <button data-dir="-1" aria-label="이전 배너">‹</button>
        <span class="count"></span>
        <button data-dir="1" aria-label="다음 배너">›</button>
      </div>
    </div>`;
  const track = $('.banner-track', root), dots = $$('.dots-row button', root), count = $('.count', root);
  const go = n => {
    i = (n + slides.length) % slides.length;
    track.style.transform = `translateX(-${i * 100}%)`;
    dots.forEach((d, k) => d.classList.toggle('on', k === i));
    count.textContent = `${i + 1} / ${slides.length}`;
  };
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const play = () => { if (!reduce && slides.length > 1) { clearInterval(timer); timer = setInterval(() => go(i + 1), 5000); } };
  const stop = () => clearInterval(timer);
  dots.forEach((d, k) => d.addEventListener('click', () => { go(k); play(); }));
  $$('[data-dir]', root).forEach(b => b.addEventListener('click', () => { go(i + Number(b.dataset.dir)); play(); }));
  const ban = $('.banner', root);
  ban.addEventListener('mouseenter', stop); ban.addEventListener('mouseleave', play);
  ban.addEventListener('focusin', stop); ban.addEventListener('focusout', play);
  go(0); play();
  return stop;
}

function mountCalendar(root, { title = '캘린더', plusHref = '#/calendar', plusLabel = '캘린더 전체 보기', compact = false } = {}) {
  root.classList.toggle('cal-compact', compact);
  const st = { y: TODAY.getFullYear(), m: TODAY.getMonth(), sel: null, cat: 'all' };
  root.innerHTML = `
    <div class="sec-head">
      <h2>${title}</h2>
      <div class="cal-tools">
        <label class="select"><span class="sr-only">일정 분류</span>
          <select data-act="cat">
            <option value="all">전체</option>
            ${Object.entries(CAT).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}
          </select>
        </label>
        <a class="plus" href="${plusHref}" ${plusHref.startsWith('http') ? ext : ''} aria-label="${plusLabel}" title="${plusLabel}">+</a>
      </div>
    </div>
    <div class="cal">
      <div class="cal-grid-wrap">
        <div class="cal-head">
          <strong class="cal-title" aria-live="polite"></strong>
          <div class="cal-nav">
            <button data-act="prev" aria-label="이전 달">‹</button>
            <button data-act="next" aria-label="다음 달">›</button>
          </div>
        </div>
        <div class="cal-week">${WEEK.map((w, k) => `<span class="${k === 0 ? 'sun' : k === 6 ? 'sat' : ''}">${w}</span>`).join('')}</div>
        <div class="cal-days"></div>
        <div class="cal-legend">${Object.entries(CAT).map(([k, v]) => `<span><i class="mk mk-${k}"></i>${v}</span>`).join('')}</div>
      </div>
      <div class="cal-panel">
        <div class="cal-panel-head"><span class="cal-panel-title"></span><span class="reset-slot"></span></div>
        <ul class="cal-list"></ul>
      </div>
    </div>`;

  const days = $('.cal-days', root), list = $('.cal-list', root);

  const render = () => {
    const evs = EVENTS.filter(e => st.cat === 'all' || e.cat === st.cat);
    $('.cal-title', root).textContent = `${st.y}. ${pad(st.m + 1)}`;

    const offset = new Date(st.y, st.m, 1).getDay();
    let html = '';
    for (let k = 0; k < 42; k++) {
      const d = new Date(st.y, st.m, 1 - offset + k), ds = ymd(d);
      const on = evs.filter(e => e.start <= ds && ds <= e.end);
      const cats = [...new Set(on.map(e => e.cat))];
      const cls = ['day', d.getMonth() !== st.m && 'out', ds === TODAY_S && 'today', st.sel === ds && 'sel',
        d.getDay() === 0 && 'sun', d.getDay() === 6 && 'sat'].filter(Boolean).join(' ');
      html += `<button class="${cls}" data-date="${ds}" aria-pressed="${st.sel === ds}"
        aria-label="${d.getMonth() + 1}월 ${d.getDate()}일${on.length ? `, 일정 ${on.length}개` : ''}">
        <span class="num">${d.getDate()}</span>
        <span class="dots">${cats.map(c => `<i class="mk mk-${c}"></i>`).join('')}</span></button>`;
    }
    days.innerHTML = html;

    let items, head;
    if (st.sel) {
      const d = toDate(st.sel);
      items = evs.filter(e => e.start <= st.sel && st.sel <= e.end);
      head = `${d.getMonth() + 1}.${d.getDate()} (${WEEK[d.getDay()]}) 일정`;
    } else {
      const a = ymd(new Date(st.y, st.m, 1)), b = ymd(new Date(st.y, st.m + 1, 0));
      items = evs.filter(e => e.start <= b && e.end >= a);
      head = `${st.m + 1}월 일정`;
    }
    $('.cal-panel-title', root).textContent = head;
    $('.reset-slot', root).innerHTML = st.sel ? `<button class="link-btn" data-act="reset">${st.m + 1}월 전체 보기</button>` : '';
    list.innerHTML = items.length
      ? items.map(e => {
          const inner = `<i class="mk mk-${e.cat}"></i><div><strong>${range(e.start, e.end)}</strong><p>${e.title}</p><small>${CAT[e.cat]}</small></div>`;
          return `<li>${e.link ? `<a class="ev" href="${e.link}">${inner}</a>` : `<div class="ev">${inner}</div>`}</li>`;
        }).join('')
      : `<li class="cal-empty">등록된 일정이 없어요</li>`;
  };

  root.addEventListener('click', e => {
    const t = e.target.closest('[data-act],[data-date]');
    if (!t) return;
    if (t.dataset.date) {
      const ds = t.dataset.date, d = toDate(ds);
      if (st.sel === ds) st.sel = null;
      else { st.sel = ds; st.y = d.getFullYear(); st.m = d.getMonth(); }
    } else if (t.dataset.act === 'prev' || t.dataset.act === 'next') {
      const d = new Date(st.y, st.m + (t.dataset.act === 'next' ? 1 : -1), 1);
      st.y = d.getFullYear(); st.m = d.getMonth(); st.sel = null;
    } else if (t.dataset.act === 'reset') st.sel = null;
    else return;
    render();
  });
  $('[data-act="cat"]', root).addEventListener('change', e => { st.cat = e.target.value; render(); });
  render();
}

// 현재 경로. 주소창 해시를 쓸 수 없는 환경(미리보기 아이프레임 등)에서도 동작하도록 직접 관리
let PATH = location.hash || '#/';
function go(hash) {
  PATH = hash;
  try { if (location.hash !== hash) history.pushState(null, '', hash); } catch (e) { /* 샌드박스: 주소 갱신 생략 */ }
  route();
}
// 내부 링크(#/...)는 브라우저 기본 이동 대신 go()로 처리
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#"]');
  if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  const href = a.getAttribute('href');
  e.preventDefault();
  if (href === '#' || !href.startsWith('#/')) return;   // '#' 자리표시 링크는 이동 없음
  go(href);
});
const syncFromUrl = () => { PATH = location.hash || '#/'; route(); };

let cleanup = null;
function route() {
  const parts = PATH.replace(/^#\/?/, '').split('/');
  const fn = PAGES[parts[0]] || PAGES.notfound;
  if (typeof cleanup === 'function') cleanup();
  const res = fn(parts);
  const app = $('#app');
  app.innerHTML = res.html;
  cleanup = res.after ? res.after(app) : null;
  const group = ROUTE_GROUP[parts[0]];
  $$('.menu-top').forEach(a => a.classList.toggle('active', a.dataset.key === group));
  $('#gnb').classList.remove('open');
  $('#burger').setAttribute('aria-expanded', 'false');
  document.body.style.overflow = '';
  window.scrollTo(0, 0);
}

$('#burger').addEventListener('click', () => {
  const open = $('#gnb').classList.toggle('open');
  $('#burger').setAttribute('aria-expanded', String(open));
  document.body.style.overflow = open ? 'hidden' : '';
});

/* ===================================================================
   공모전 팝업 — 공모전 기간에만, "오늘 하루 / 일주일간 보지 않기"
   =================================================================== */
function initPopup() {
  const c = DATA.contests.find(x => x.popup && contestStatus(x) === '진행중');
  if (!c) return;
  const key = `int_popup_hide_${c.id}`;
  let until = 0;
  try { until = Number(localStorage.getItem(key)) || 0; } catch (e) {}
  if (Date.now() < until) return;

  const m = $('#popup');
  const dd = dday(c.end);
  m.innerHTML = `<div class="modal-box">
    <div class="placeholder modal-img">공모전 포스터 자리</div>
    <div class="modal-body">
      <span class="badge solid">${dd === 0 ? 'D-DAY' : 'D-' + dd}</span>
      <h2 id="popup-title">${c.title}</h2>
      <p>${c.desc}</p>
      <p class="note">접수 ${full(c.start)} ~ ${full(c.end)}</p>
      <a class="btn" href="#/contest/${c.id}" data-close>자세히 보기</a>
    </div>
    <div class="modal-foot">
      <label><input type="checkbox" data-hide="day"> 오늘 하루 보지 않기</label>
      <label><input type="checkbox" data-hide="week"> 일주일간 보지 않기</label>
      <button class="close" data-close>닫기</button>
    </div></div>`;
  m.hidden = false;

  const boxes = $$('[data-hide]', m);
  boxes.forEach(b => b.addEventListener('change', () => { if (b.checked) boxes.forEach(o => { if (o !== b) o.checked = false; }); }));

  const close = () => {
    const sel = boxes.find(b => b.checked)?.dataset.hide;
    let t = 0;
    if (sel === 'day') { const n = new Date(); t = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1).getTime(); }
    if (sel === 'week') t = Date.now() + 7 * 864e5;
    if (t) { try { localStorage.setItem(key, String(t)); } catch (e) {} }
    m.hidden = true;
    document.removeEventListener('keydown', onKey);
  };
  const onKey = e => { if (e.key === 'Escape') close(); };
  $$('[data-close]', m).forEach(b => b.addEventListener('click', close));
  m.addEventListener('click', e => { if (e.target === m) close(); });
  document.addEventListener('keydown', onKey);
  $('.close', m).focus();
}

renderNav();
window.addEventListener('hashchange', syncFromUrl);
window.addEventListener('popstate', syncFromUrl);
route();
initPopup();
</script>
</body>
</html>
